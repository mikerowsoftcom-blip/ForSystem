services:
  - type: web
    name: ali-analogical-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: OLLAMA_URL
        sync: false
      - key: LLM_MODEL
        value: qwen2.5:7b
      - key: DB_PATH
        value: ali_memory.db
